<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>Fast Excel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand-row">
          <h1>Fast Excel</h1>
          <button id="lang-toggle-btn" class="btn btn-ghost lang-toggle" data-i18n="langToggle"></button>
        </div>
        <p class="tagline" data-i18n="tagline"></p>

        <div class="recipe-header">
          <h2 data-i18n="recipeHeading"></h2>
          <div class="recipe-header-actions">
            <button id="load-recipe-btn" class="btn btn-ghost" data-i18n="importBtn" data-i18n-title="importBtnTitle"></button>
            <button id="save-recipe-btn" class="btn btn-ghost" data-i18n="exportBtn" data-i18n-title="exportBtnTitle"></button>
            <button id="add-field-btn" class="btn btn-ghost" data-i18n="addFieldBtn"></button>
          </div>
        </div>
        <div id="field-list" class="field-list"></div>

        <div class="threshold-row">
          <label for="threshold-input" data-i18n="thresholdLabel"></label>
          <input id="threshold-input" type="range" min="0.5" max="0.95" step="0.01" value="0.72" />
          <span id="threshold-value">0.72</span>
        </div>
      </aside>

      <main class="main">
        <div class="toolbar">
          <button id="select-folder-btn" class="btn" data-i18n="selectFolderBtn"></button>
          <span id="folder-path" class="folder-path" data-i18n="noFolderSelected"></span>
          <label class="checkbox-label">
            <input id="recursive-checkbox" type="checkbox" />
            <span data-i18n="recursiveLabel"></span>
          </label>
          <button id="scan-btn" class="btn btn-primary" disabled data-i18n="scanBtn"></button>
          <button id="cancel-scan-btn" class="btn" hidden data-i18n="cancelBtn"></button>
          <button id="export-btn" class="btn btn-primary" disabled data-i18n="exportReportBtn"></button>
        </div>

        <div id="progress-wrap" class="progress-wrap" hidden>
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="progress-text" class="progress-text"></span>
        </div>

        <div id="status-line" class="status-line"></div>
        <div id="error-list" class="error-list" hidden></div>

        <div class="table-wrap">
          <table id="results-table">
            <thead id="results-thead"></thead>
            <tbody id="results-tbody"></tbody>
          </table>
        </div>
      </main>
    </div>

    <div id="preview-modal" class="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3 id="preview-title" data-i18n="previewTitle"></h3>
          <button id="preview-close-btn" class="btn-close">&times;</button>
        </div>
        <div id="preview-meta" class="modal-meta"></div>
        <div id="preview-grid-wrap" class="modal-grid-wrap">
          <table id="preview-grid"></table>
        </div>
        <div class="modal-override">
          <p class="field-card-hint" data-i18n="overrideHint"></p>
          <div class="field-card-row">
            <div style="flex:1">
              <label data-i18n="overrideSheetLabel"></label>
              <input id="override-sheet" type="text" />
            </div>
            <div style="width:120px">
              <label data-i18n="overrideAddressLabel"></label>
              <input id="override-address" type="text" placeholder="C5" />
            </div>
            <div style="align-self:flex-end">
              <button id="override-apply-btn" class="btn" data-i18n="overrideApplyBtn"></button>
            </div>
          </div>
          <label class="checkbox-label">
            <input id="exclude-checkbox" type="checkbox" />
            <span data-i18n="excludeLabel"></span>
          </label>
        </div>
        <div class="modal-footer">
          <button id="preview-done-btn" class="btn btn-primary" data-i18n="doneBtn"></button>
        </div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
