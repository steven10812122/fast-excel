name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The test suite only exercises the plain-Node engine code (exceljs/
      # xlsx + src/engine) -- it never launches Electron itself, so there's
      # no need to pull down its ~100MB binary just to run `npm test`.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
